<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藝廊展覽進度規劃</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── 根變數 ── */
:root {
  --ink:       #1a1814;
  --ink-2:     #4a4642;
  --ink-3:     #8a8480;
  --paper:     #faf8f4;
  --paper-2:   #f2efe8;
  --paper-3:   #e8e4da;
  --gold:      #b8924a;
  --gold-lt:   #f0e4cc;
  --teal:      #3a7a6a;
  --teal-lt:   #d4ede6;
  --blue:      #3a5a8a;
  --blue-lt:   #d4e0ef;
  --mauve:     #7a5a7a;
  --mauve-lt:  #e8d8e8;
  --border:    rgba(26,24,20,0.12);
  --border-md: rgba(26,24,20,0.2);
  --radius:    6px;
  --serif:     'Noto Serif TC', serif;
  --sans:      'Noto Sans TC', sans-serif;
  --shadow:    0 2px 12px rgba(26,24,20,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ── 頂部 ── */
.topbar {
  background: var(--ink);
  color: var(--paper);
  padding: 0 2rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-brand {
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--gold);
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.sync-status {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  display: flex; align-items: center; gap: 5px;
}
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #6bc18a;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.sync-dot.syncing { background: var(--gold); }
.sync-dot.error { background: #e06060; animation: none; }

/* ── 主容器 ── */
.container { max-width: 1200px; margin: 0 auto; padding: 2rem 2rem 4rem; }

/* ── 年份導航 ── */
.page-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.page-title { font-family: var(--serif); font-size: 24px; font-weight: 500; color: var(--ink); }
.page-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; font-family: var(--sans); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.year-nav { display: flex; align-items: center; gap: 6px; }
.year-btn {
  background: none; border: 1px solid var(--border-md); border-radius: var(--radius);
  width: 28px; height: 28px; cursor: pointer; color: var(--ink-2);
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.year-btn:hover { background: var(--paper-2); }
.year-num { font-family: var(--serif); font-size: 16px; font-weight: 500; min-width: 42px; text-align: center; }
.add-btn {
  background: var(--ink); color: var(--paper); border: none;
  border-radius: var(--radius); padding: 7px 16px;
  font-family: var(--sans); font-size: 13px; cursor: pointer;
  transition: opacity 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.add-btn:hover { opacity: 0.85; }

/* ── 統計列 ── */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
.stat-card {
  background: var(--paper-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.875rem 1rem;
}
.stat-label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; margin-bottom: 4px; }
.stat-val { font-family: var(--serif); font-size: 24px; font-weight: 500; }
.stat-unit { font-family: var(--sans); font-size: 12px; color: var(--ink-3); margin-left: 2px; }

/* ── 甘特圖 ── */
.gantt-wrap { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.gantt-header { display: grid; grid-template-columns: 200px 1fr; border-bottom: 1px solid var(--border); }
.gantt-header-label { padding: 8px 12px; font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; border-right: 1px solid var(--border); }
.months-row { display: grid; grid-template-columns: repeat(12, 1fr); }
.month-cell { font-size: 11px; color: var(--ink-3); text-align: center; padding: 8px 0; border-right: 1px solid var(--border); }
.month-cell:last-child { border-right: none; }

.gantt-body { }
.gantt-row {
  display: grid; grid-template-columns: 200px 1fr;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.gantt-row:last-child { border-bottom: none; }
.gantt-row:hover { background: var(--paper); }
.gantt-info {
  padding: 10px 12px;
  border-right: 1px solid var(--border);
  cursor: pointer;
  display: flex; flex-direction: column; justify-content: center;
}
.gantt-name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.status-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 10px;
  font-weight: 500; letter-spacing: 0.02em; white-space: nowrap;
}
.progress-text { font-size: 10px; color: var(--ink-3); }
.gantt-tl {
  position: relative; height: 48px; cursor: pointer;
  background: white;
}
.tl-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(12, 1fr); pointer-events: none; }
.tl-cell { border-right: 1px solid var(--border); }
.tl-cell:last-child { border-right: none; }
.today-marker { position: absolute; top: 0; width: 1px; height: 100%; pointer-events: none; z-index: 4; }
.bar {
  position: absolute; top: 10px; height: 28px;
  border-radius: 4px; z-index: 3;
  display: flex; align-items: center; padding: 0 8px;
  font-size: 11px; font-weight: 500; overflow: hidden; white-space: nowrap;
  transition: opacity 0.15s, transform 0.15s;
}
.bar:hover { opacity: 0.88; transform: scaleY(1.04); }

/* ── 狀態顏色 ── */
.s-planning  { background: var(--mauve-lt); color: var(--mauve); }
.s-confirmed { background: var(--blue-lt);  color: var(--blue); }
.s-active    { background: var(--teal-lt);  color: var(--teal); }
.s-done      { background: var(--paper-3);  color: var(--ink-3); }
.bar-planning  { background: var(--mauve); color: white; }
.bar-confirmed { background: var(--blue);  color: white; }
.bar-active    { background: var(--teal);  color: white; }
.bar-done      { background: var(--paper-3); color: var(--ink-3); }

/* ── 載入狀態 ── */
.loading-state {
  text-align: center; padding: 3rem; color: var(--ink-3);
  font-size: 13px;
}
.error-state {
  text-align: center; padding: 2rem;
  background: #fef2f2; border: 1px solid #fca5a5;
  border-radius: var(--radius); color: #b91c1c;
  font-size: 13px; margin: 1rem 0;
}

/* ── 彈窗 ── */
.overlay {
  display: none; position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(26,24,20,0.4); z-index: 200;
  align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--paper);
  border: 1px solid var(--border-md);
  border-radius: 10px;
  width: 480px; max-width: 92vw;
  max-height: 88vh; overflow-y: auto;
  padding: 1.5rem;
  box-shadow: 0 12px 40px rgba(26,24,20,0.18);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 0.875rem;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-family: var(--serif); font-size: 16px; font-weight: 500; }
.modal-close {
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: var(--ink-3); line-height: 1; padding: 0 2px;
}

.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.field input, .field select {
  font-family: var(--sans); font-size: 13px;
  padding: 7px 10px;
  border: 1px solid var(--border-md);
  border-radius: var(--radius);
  background: white; color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus { border-color: var(--gold); }

.tasks-section { margin-top: 1.25rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.tasks-title { font-size: 12px; color: var(--ink-3); letter-spacing: 0.05em; margin-bottom: 10px; }
.tasks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.task-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.task-item:hover { background: var(--paper-2); }
.task-item.checked { background: var(--teal-lt); border-color: rgba(58,122,106,0.3); }
.task-item input[type="checkbox"] { display: none; }
.task-check {
  width: 14px; height: 14px; border-radius: 3px;
  border: 1.5px solid var(--border-md); background: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.12s;
}
.task-item.checked .task-check { background: var(--teal); border-color: var(--teal); }
.task-check-icon { display: none; width: 8px; height: 6px; }
.task-check-icon path { stroke: white; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.task-item.checked .task-check-icon { display: block; }
.task-name { font-size: 12px; color: var(--ink-2); }
.task-item.checked .task-name { color: var(--teal); }

.modal-actions {
  display: flex; gap: 8px; margin-top: 1.5rem;
  padding-top: 1rem; border-top: 1px solid var(--border);
}
.btn-del { background: none; border: 1px solid #e5a0a0; border-radius: var(--radius); padding: 7px 14px; font-size: 12px; cursor: pointer; color: #b04040; margin-right: auto; font-family: var(--sans); }
.btn-del:hover { background: #fef2f2; }
.btn-cancel { background: none; border: 1px solid var(--border-md); border-radius: var(--radius); padding: 7px 16px; font-size: 13px; cursor: pointer; color: var(--ink-2); font-family: var(--sans); }
.btn-save { background: var(--ink); color: var(--paper); border: none; border-radius: var(--radius); padding: 7px 20px; font-size: 13px; cursor: pointer; font-family: var(--sans); }
.btn-save:hover { opacity: 0.85; }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── API 設定提示 ── */
.api-banner {
  background: var(--gold-lt); border: 1px solid rgba(184,146,74,0.4);
  border-radius: var(--radius); padding: 1rem 1.25rem;
  margin-bottom: 1.25rem; font-size: 13px; color: var(--ink-2);
  display: flex; align-items: flex-start; gap: 10px;
}
.api-banner strong { color: var(--gold); display: block; margin-bottom: 3px; font-size: 12px; letter-spacing: 0.04em; }
.api-banner code { background: rgba(184,146,74,0.15); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>

<!-- ── 頂部 ── -->
<div class="topbar">
  <div class="topbar-brand">藝廊展覽進度規劃</div>
  <div class="topbar-right">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">已連線</span>
    </div>
  </div>
</div>

<!-- ── 主體 ── -->
<div class="container">

  <!-- API 尚未設定時顯示提示 -->
  <div class="api-banner" id="apiBanner" style="display:none">
    <div>
      <strong>⚙ 尚未設定 API 網址</strong>
      請開啟此 HTML 檔案，將頂部的 <code>API_URL</code> 替換為你的 Google Apps Script 部署網址，即可開始使用。
    </div>
  </div>

  <!-- 頁首 -->
  <div class="page-header">
    <div>
      <div class="page-title" id="pageTitle">年度展覽規劃</div>
      <div class="page-sub">點擊展覽列以編輯詳情與進度</div>
    </div>
    <div class="header-actions">
      <div class="year-nav">
        <button class="year-btn" onclick="changeYear(-1)">&#8592;</button>
        <div class="year-num" id="yearNum">2026</div>
        <button class="year-btn" onclick="changeYear(1)">&#8594;</button>
      </div>
      <button class="add-btn" onclick="openAdd()">
        <span>＋</span> 新增展覽
      </button>
    </div>
  </div>

  <!-- 統計 -->
  <div class="stats" id="statsBar"></div>

  <!-- 甘特圖 -->
  <div class="gantt-wrap">
    <div class="gantt-header">
      <div class="gantt-header-label">展覽名稱</div>
      <div class="months-row" id="monthsRow"></div>
    </div>
    <div class="gantt-body" id="ganttBody">
      <div class="loading-state" id="loadingState">載入中…</div>
    </div>
  </div>

</div>

<!-- ── 彈窗 ── -->
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">展覽詳情</div>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>

    <div class="field-grid">
      <div class="field full"><label>展覽名稱</label><input id="fName" type="text" placeholder="例：春季油畫聯展"></div>
      <div class="field"><label>藝術家 / 策展人</label><input id="fArtist" type="text" placeholder="姓名"></div>
      <div class="field"><label>展覽類型</label>
        <select id="fType">
          <option>油畫</option><option>攝影</option><option>雕塑</option>
          <option>裝置藝術</option><option>版畫</option><option>水彩</option>
          <option>混合媒材</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>開展日期</label><input id="fStart" type="date"></div>
      <div class="field"><label>結束日期</label><input id="fEnd" type="date"></div>
      <div class="field"><label>狀態</label>
        <select id="fStatus">
          <option value="planning">規劃中</option>
          <option value="confirmed">已確認</option>
          <option value="active">展覽中</option>
          <option value="done">已結束</option>
        </select>
      </div>
      <div class="field full"><label>展間</label><input id="fRoom" type="text" placeholder="例：主展廳、二號廳、戶外廣場"></div>
    </div>

    <div class="tasks-section">
      <div class="tasks-title">標準作業進度</div>
      <div class="tasks-grid" id="tasksGrid"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-del" id="deleteBtn" onclick="deleteExh()">刪除展覽</button>
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" id="saveBtn" onclick="saveExh()">儲存</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  ⚙ 將此網址替換為你的 Apps Script 部署網址
// ════════════════════════════════════════════════
const API_URL = 'https://script.google.com/a/macros/artemingallery.com/s/AKfycbz0EqzKzgu44R3NY9n-QwgEnmogxvv2zO7vf33gBZgIxx2MmQ_M7oba7mvEXcy3TO3igA/exec';
// ════════════════════════════════════════════════

const TASK_NAMES = [
  '場地準備','設計製作','作品確認',
  '展品運輸','裝置完成','媒體通知',
  '開幕宣傳','開幕茶會','結展撤展'
];
const STATUS_LABELS = { planning:'規劃中', confirmed:'已確認', active:'展覽中', done:'已結束' };
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

let currentYear = new Date().getFullYear();
let exhibitions = [];
let editingId = null;
let isSaving = false;

// ── API ──
const apiReady = () => API_URL !== 'YOUR_APPS_SCRIPT_URL_HERE';

function setSyncState(state) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
  lbl.textContent = state === 'syncing' ? '同步中…' : state === 'error' ? '連線失敗' : '已連線';
}

async function apiFetch(method, body) {
  setSyncState('syncing');
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const url = method === 'GET' ? `${API_URL}?action=list&year=${currentYear}` : API_URL;
    const res = await fetch(url, opts);
    const data = await res.json();
    setSyncState('ok');
    return data;
  } catch(e) {
    setSyncState('error');
    throw e;
  }
}

async function loadExhibitions() {
  if (!apiReady()) {
    document.getElementById('apiBanner').style.display = 'flex';
    document.getElementById('loadingState').textContent = '請先設定 API 網址';
    return;
  }
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('loadingState').textContent = '載入中…';
  try {
    const res = await apiFetch('GET');
    if (res.success) {
      exhibitions = res.data;
      renderAll();
    } else {
      showError('載入失敗：' + (res.error || '未知錯誤'));
    }
  } catch(e) { showError('無法連線至伺服器，請確認 API 網址是否正確。'); }
}

function showError(msg) {
  document.getElementById('ganttBody').innerHTML = `<div class="error-state">${msg}</div>`;
}

// ── 渲染 ──
function pct(dateStr) {
  const d = new Date(dateStr);
  const s = new Date(currentYear, 0, 1);
  const e = new Date(currentYear + 1, 0, 1);
  return Math.max(0, Math.min(1, (d - s) / (e - s)));
}

function renderAll() {
  document.getElementById('yearNum').textContent = currentYear;
  document.getElementById('pageTitle').textContent = `${currentYear} 年度展覽規劃`;

  // 月份
  document.getElementById('monthsRow').innerHTML =
    MONTHS.map(m => `<div class="month-cell">${m}</div>`).join('');

  // 統計
  const counts = { planning:0, confirmed:0, active:0, done:0 };
  exhibitions.forEach(e => counts[e.status] = (counts[e.status]||0) + 1);
  const avgProg = exhibitions.length
    ? Math.round(exhibitions.reduce((s,e) => s + e.tasks.filter(x=>x).length / e.tasks.length, 0) / exhibitions.length * 100)
    : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-label">總展覽數</div><div class="stat-val">${exhibitions.length}<span class="stat-unit">檔</span></div></div>
    <div class="stat-card"><div class="stat-label">已結束</div><div class="stat-val">${counts.done||0}<span class="stat-unit">檔</span></div></div>
    <div class="stat-card"><div class="stat-label">進行中</div><div class="stat-val">${counts.active||0}<span class="stat-unit">檔</span></div></div>
    <div class="stat-card"><div class="stat-label">平均進度</div><div class="stat-val">${avgProg}<span class="stat-unit">%</span></div></div>
  `;

  // 甘特
  const todayPct = pct(new Date().toISOString().slice(0,10));
  const body = document.getElementById('ganttBody');
  if (!exhibitions.length) {
    body.innerHTML = '<div class="loading-state">此年度尚無展覽，請點擊「新增展覽」開始規劃。</div>';
    return;
  }
  body.innerHTML = '';
  document.getElementById('loadingState') && (document.getElementById('loadingState').style.display = 'none');

  exhibitions.forEach(e => {
    const sp = pct(e.start) * 100, ep = pct(e.end) * 100;
    const bLeft = Math.max(0, sp), bRight = Math.min(100, ep);
    const bWidth = Math.max(0, bRight - bLeft);
    const done = e.tasks.filter(x=>x).length;
    const prog = Math.round(done / e.tasks.length * 100);

    const row = document.createElement('div');
    row.className = 'gantt-row';
    row.innerHTML = `
      <div class="gantt-info" onclick="openEdit(${e.id})">
        <div class="gantt-name">${e.name}</div>
        <div class="gantt-meta">
          <span class="status-badge s-${e.status}">${STATUS_LABELS[e.status]}</span>
          <span class="progress-text">${prog}%</span>
        </div>
      </div>
      <div class="gantt-tl" onclick="openEdit(${e.id})">
        <div class="tl-grid">${Array(12).fill('<div class="tl-cell"></div>').join('')}</div>
        ${currentYear === new Date().getFullYear() ? `<div class="today-marker" style="left:${todayPct*100}%;background:var(--gold);opacity:0.6;"></div>` : ''}
        ${bWidth > 0 ? `<div class="bar bar-${e.status}" style="left:${bLeft}%;width:${bWidth}%;">${bWidth > 6 ? e.name : ''}</div>` : ''}
      </div>
    `;
    body.appendChild(row);
  });
}

// ── 彈窗 ──
function openEdit(id) {
  editingId = id;
  const e = exhibitions.find(x => x.id === id);
  document.getElementById('modalTitle').textContent = '編輯展覽';
  document.getElementById('deleteBtn').style.display = 'inline-block';
  fillModal(e);
  document.getElementById('overlay').classList.add('open');
}
function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增展覽';
  document.getElementById('deleteBtn').style.display = 'none';
  fillModal({
    name:'', artist:'', type:'油畫',
    start: `${currentYear}-01-01`, end: `${currentYear}-03-31`,
    status:'planning', room:'',
    tasks: Array(9).fill(0)
  });
  document.getElementById('overlay').classList.add('open');
}
function fillModal(e) {
  document.getElementById('fName').value = e.name || '';
  document.getElementById('fArtist').value = e.artist || '';
  document.getElementById('fType').value = e.type || '其他';
  document.getElementById('fStart').value = e.start || '';
  document.getElementById('fEnd').value = e.end || '';
  document.getElementById('fStatus').value = e.status || 'planning';
  document.getElementById('fRoom').value = e.room || '';

  const tasks = e.tasks || Array(9).fill(0);
  document.getElementById('tasksGrid').innerHTML = TASK_NAMES.map((t, i) => `
    <div class="task-item ${tasks[i] ? 'checked' : ''}" onclick="toggleTask(this, ${i})">
      <div class="task-check">
        <svg class="task-check-icon" viewBox="0 0 8 6"><path d="M1 3L3 5L7 1"/></svg>
      </div>
      <span class="task-name">${t}</span>
      <input type="checkbox" id="t${i}" ${tasks[i] ? 'checked' : ''} style="display:none">
    </div>
  `).join('');
}
function toggleTask(el, i) {
  el.classList.toggle('checked');
  el.querySelector('input[type=checkbox]').checked = el.classList.contains('checked');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function maybeClose(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

async function saveExh() {
  if (isSaving) return;
  isSaving = true;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  const tasks = Array.from(document.querySelectorAll('#tasksGrid input[type=checkbox]')).map(c => c.checked ? 1 : 0);
  const data = {
    id: editingId,
    name: document.getElementById('fName').value || '未命名展覽',
    artist: document.getElementById('fArtist').value,
    type: document.getElementById('fType').value,
    start: document.getElementById('fStart').value,
    end: document.getElementById('fEnd').value,
    status: document.getElementById('fStatus').value,
    room: document.getElementById('fRoom').value,
    tasks
  };
  try {
    const action = editingId ? 'update' : 'create';
    const res = await apiFetch('POST', { action, data, id: editingId });
    if (res.success) { closeModal(); await loadExhibitions(); }
    else alert('儲存失敗：' + (res.error || '未知錯誤'));
  } catch(e) { alert('網路錯誤，請稍後再試'); }
  isSaving = false; btn.disabled = false; btn.textContent = '儲存';
}

async function deleteExh() {
  if (!editingId || !confirm('確定要刪除此展覽？')) return;
  try {
    const res = await apiFetch('POST', { action:'delete', id: editingId });
    if (res.success) { closeModal(); await loadExhibitions(); }
    else alert('刪除失敗：' + (res.error || '未知錯誤'));
  } catch(e) { alert('網路錯誤'); }
}

function changeYear(d) { currentYear += d; loadExhibitions(); }

// ── 初始化 ──
loadExhibitions();
</script>
</body>
</html>
