<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemin Gallery 管理系統</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="藝廊管理">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ 登入畫面 ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">ARTEMIN GALLERY</div>
    <div class="login-title">管理系統</div>
    <div class="login-sub">請使用藝廊 Google 帳號登入</div>
    <div id="g_id_onload"
      data-client_id="168301456970-nptqdg437fssl7lu7vu9u8i5uf6and3h.apps.googleusercontent.com"
      data-context="signin"
      data-ux_mode="popup"
      data-callback="handleGoogleLogin"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-locale="zh-TW"
      data-width="280">
    </div>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ══ 主應用 ══ -->
<div id="appScreen" style="display:none">

  <!-- 頂部導覽 -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">ARTEMIN GALLERY</div>
      <nav class="tab-nav">
        <button class="tab-btn active" id="tab-exhibition" onclick="switchTab('exhibition')">
          <span class="tab-icon">📅</span>展覽規劃
        </button>
        <button class="tab-btn" id="tab-consignment" onclick="switchTab('consignment')">
          <span class="tab-icon">🖼</span>徵件管理
        </button>
      </nav>
    </div>
    <div class="topbar-right">
      <div class="sync-status" id="syncStatus">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">已連線</span>
      </div>
      <div class="user-info">
        <img class="user-avatar" id="userAvatar" src="" alt="">
        <span class="user-name" id="userName"></span>
      </div>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- ══ 展覽規劃頁 ══ -->
  <div id="page-exhibition" class="page-panel">
    <div class="container">
      <div class="page-header">
        <div>
          <div class="page-title" id="pageTitle">年度展覽規劃</div>
          <div class="page-sub">點擊展覽列以編輯詳情與進度</div>
        </div>
        <div class="header-actions">
          <div class="year-nav">
            <button class="year-btn" onclick="changeYear(-1)">←</button>
            <div class="year-num" id="yearNum">2026</div>
            <button class="year-btn" onclick="changeYear(1)">→</button>
          </div>
          <button class="add-btn" onclick="openAddExh()">＋ 新增展覽</button>
        </div>
      </div>
      <div class="stats" id="exhStatsBar"></div>
      <div class="gantt-wrap">
        <div class="gantt-header">
          <div class="gantt-header-label">展覽名稱</div>
          <div class="months-row" id="monthsRow"></div>
        </div>
        <div id="ganttBody"><div class="loading-state">載入中…</div></div>
      </div>
      <div class="card-list" id="cardList"></div>
    </div>
  </div>

  <!-- ══ 徵件管理頁 ══ -->
  <div id="page-consignment" class="page-panel" style="display:none">
    <div class="container">
      <div class="page-header">
        <div>
          <div class="page-title">藝術作品徵件管理</div>
          <div class="page-sub">作品委賣登錄、定價與合約管理</div>
        </div>
        <div class="header-actions">
          <button class="add-btn export-btn-top" onclick="openExport()">↑ 批量匯出</button>
          <button class="add-btn" onclick="openAddArtwork()">＋ 登錄新作品</button>
        </div>
      </div>
      <div class="stats" id="artStatsBar"></div>
      <div class="art-toolbar">
        <input type="text" id="artSearch" placeholder="搜尋作品、藝術家、委賣人…" oninput="renderArtworks()">
        <select id="artStatusFilter" onchange="renderArtworks()">
          <option value="">全部狀態</option>
          <option value="new">新登錄</option>
          <option value="consign">委賣中</option>
          <option value="reserved">預留</option>
          <option value="sold">已售出</option>
        </select>
        <select id="artLocFilter" onchange="renderArtworks()">
          <option value="">全部位置</option>
          <option value="gallery">藝廊</option>
          <option value="collector">藏家</option>
        </select>
        <select id="artContractFilter" onchange="renderArtworks()">
          <option value="">全部合約</option>
          <option value="1">已簽約</option>
          <option value="0">未簽約</option>
        </select>
        <select id="artMediaFilter" onchange="renderArtworks()">
          <option value="">全部媒材</option>
          <option value="oil">油彩</option>
          <option value="acrylic">壓克力</option>
          <option value="watercolor">水彩</option>
          <option value="ink">水墨</option>
          <option value="print">版畫</option>
          <option value="sculpture">雕塑</option>
          <option value="photo">攝影</option>
          <option value="mixed">複合媒材</option>
          <option value="other">其他</option>
        </select>
        <span class="sel-info" id="artSelInfo"></span>
        <button class="year-btn" id="artClearSel" style="display:none;color:#b04040;border-color:#e5a0a0;padding:0 10px;width:auto" onclick="clearArtSel()">✕ 取消選取</button>
      </div>
      <div class="art-table-wrap">
        <table class="art-table">
          <thead>
            <tr>
              <th style="width:38px"><input type="checkbox" id="artCheckAll" onchange="toggleAllArt(this.checked)"></th>
              <th>作品</th>
              <th class="sortable" onclick="artSortBy('artist')">藝術家</th>
              <th class="sortable" onclick="artSortBy('year')">年份</th>
              <th>媒材</th>
              <th>尺寸(cm)</th>
              <th>委賣人</th>
              <th>位置</th>
              <th>委賣合約</th>
              <th class="sortable" onclick="artSortBy('netPrice')">賣方實拿</th>
              <th class="sortable" onclick="artSortBy('offerPrice')">藝廊售價</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="artTbody"></tbody>
        </table>
        <div class="art-empty" id="artEmpty" style="display:none">
          <div style="font-size:40px;margin-bottom:10px">🖼</div>
          <p>目前無作品記錄</p>
          <p style="font-size:12px;color:var(--ink-3);margin-top:4px">點選右上角「登錄新作品」開始建檔</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ 展覽彈窗 ══ -->
<div class="overlay" id="exhOverlay" onclick="maybeCloseExh(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="exhModalTitle">展覽詳情</div>
      <button class="modal-close" onclick="closeExhModal()">×</button>
    </div>
    <div class="field-grid">
      <div class="field full"><label>展覽名稱</label><input id="fName" type="text" placeholder="例：春季油畫聯展"></div>
      <div class="field"><label>藝術家</label><input id="fArtist" type="text" placeholder="藝術家姓名"></div>
      <div class="field"><label>策展人</label><input id="fCurator" type="text" placeholder="策展人姓名"></div>
      <div class="field"><label>展覽類型</label>
        <select id="fType">
          <option>畫作</option><option>攝影</option><option>雕塑</option>
          <option>裝置藝術</option><option>版畫</option><option>水彩</option>
          <option>混合媒材</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>展間</label><input id="fRoom" type="text" placeholder="例：主展廳"></div>
      <div class="field"><label>開展日期</label><input id="fStart" type="date"></div>
      <div class="field"><label>結束日期</label><input id="fEnd" type="date"></div>
      <div class="field"><label>狀態</label>
        <select id="fStatus">
          <option value="planning">規劃中</option>
          <option value="confirmed">已確認</option>
          <option value="active">展覽中</option>
          <option value="done">已結束</option>
        </select>
      </div>
    </div>
    <div class="tasks-section">
      <div class="tasks-title">標準作業進度</div>
      <div class="task-list" id="taskList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-del" id="exhDeleteBtn" onclick="deleteExh()">刪除展覽</button>
      <button class="btn-cancel" onclick="closeExhModal()">取消</button>
      <button class="btn-save" id="saveBtn" onclick="saveExh()">儲存</button>
    </div>
  </div>
</div>

<!-- ══ 作品彈窗 ══ -->
<div class="overlay" id="artOverlay" onclick="maybeCloseArt(event)">
  <div class="modal art-modal">
    <div class="modal-head">
      <div class="modal-title" id="artModalTitle">登錄新作品</div>
      <button class="modal-close" onclick="closeArtModal()">×</button>
    </div>
    <div class="art-form-grid">
      <div class="section-title first">基本資料</div>
      <div class="field"><label>作品名稱 <span class="req">*</span></label><input type="text" id="af_title" placeholder="例：山水系列 No.3"></div>
      <div class="field"><label>藝術家 <span class="req">*</span></label><input type="text" id="af_artist" placeholder="藝術家姓名"></div>
      <div class="field"><label>創作年份</label><input type="number" id="af_year" placeholder="2024" min="1800" max="2099"></div>
      <div class="field"><label>狀態</label>
        <select id="af_status">
          <option value="new">新登錄</option><option value="consign">委賣中</option>
          <option value="reserved">預留</option><option value="sold">已售出</option>
        </select>
      </div>
      <div class="field"><label>作品位置</label>
        <select id="af_location">
          <option value="gallery">藝廊</option><option value="collector">藏家</option>
        </select>
      </div>
      <div class="field"><label>位置備註</label><input type="text" id="af_locationNote" placeholder="例：王藏家 / 台北市信義區"></div>

      <div class="section-title">委賣合約</div>
      <div class="contract-block full" id="af_contractBlock">
        <div class="contract-toggle">
          <label class="contract-toggle-label">
            <input type="checkbox" id="af_contractSigned" onchange="toggleArtContract()">
            已簽訂委賣合約
          </label>
          <span id="af_contractTag" class="contract-tag unsigned">未簽約</span>
        </div>
        <div class="contract-sub-fields" id="af_contractFields">
          <div class="field"><label>簽署日期</label><input type="date" id="af_contractDate"></div>
          <div class="field"><label>合約到期日</label><input type="date" id="af_contractExpiry"></div>
          <div class="field full"><label>合約備註（編號、特殊條款）</label><input type="text" id="af_contractNote" placeholder="例：合約編號 C-2024-001"></div>
        </div>
      </div>

      <div class="section-title">媒材與尺寸</div>
      <div class="field"><label>媒材</label>
        <select id="af_media">
          <option value="oil">油彩</option><option value="acrylic">壓克力</option>
          <option value="watercolor">水彩</option><option value="ink">水墨</option>
          <option value="print">版畫</option><option value="sculpture">雕塑</option>
          <option value="photo">攝影</option><option value="mixed">複合媒材</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="field"><label>載體</label><input type="text" id="af_support" placeholder="例：麻布、宣紙、鋁板"></div>
      <div class="field"><label>寬 (cm)</label><input type="number" id="af_w" placeholder="80" min="0" step="0.1"></div>
      <div class="field"><label>高 (cm)</label><input type="number" id="af_h" placeholder="60" min="0" step="0.1"></div>
      <div class="field"><label>深 (cm)（雕塑）</label><input type="number" id="af_d" min="0" step="0.1"></div>
      <div class="field full"><label>作品說明</label><textarea id="af_note" placeholder="來源說明、展覽紀錄、保存狀況…"></textarea></div>
      <div class="field full"><label>內部備註 <span style="font-size:11px;color:var(--ink-3);font-weight:400">（不對外顯示）</span></label><textarea id="af_internalNote" placeholder="議價空間、特殊交代、運輸需求…" style="min-height:52px"></textarea></div>

      <div class="section-title">委賣人資訊</div>
      <div class="field"><label>委賣人姓名 <span class="req">*</span></label><input type="text" id="af_consignor" placeholder="姓名"></div>
      <div class="field"><label>聯絡電話</label><input type="text" id="af_phone" placeholder="0912-345-678"></div>
      <div class="field full"><label>聯絡信箱</label><input type="email" id="af_email" placeholder="consignor@email.com"></div>

      <div class="section-title">定價資訊</div>
      <div class="field"><label>賣方實拿（NTD）</label><input type="number" id="af_netPrice" placeholder="200000" min="0"></div>
      <div class="field"><label>藝廊售價（NTD）</label><input type="number" id="af_offerPrice" placeholder="250000" min="0"></div>

      <div class="section-title">圖片</div>
      <div class="field full">
        <label>高清圖</label>
        <div class="img-upload-area" onclick="document.getElementById('af_upload_hq').click()">
          <div style="font-size:26px;margin-bottom:4px">📷</div>
          <p>點擊上傳高清圖（可多張）</p>
        </div>
        <input type="file" id="af_upload_hq" accept="image/*" multiple style="display:none" onchange="handleArtImgs(this,'hq')">
        <div class="img-previews" id="af_prev_hq"></div>
      </div>
      <div class="field full">
        <label>現況圖</label>
        <div class="img-upload-area" onclick="document.getElementById('af_upload_cond').click()">
          <div style="font-size:26px;margin-bottom:4px">🔍</div>
          <p>點擊上傳現況圖（可多張）</p>
        </div>
        <input type="file" id="af_upload_cond" accept="image/*" multiple style="display:none" onchange="handleArtImgs(this,'cond')">
        <div class="img-previews" id="af_prev_cond"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-del" id="artDeleteBtn" onclick="deleteArtwork()" style="display:none">刪除作品</button>
      <button class="btn-cancel" onclick="closeArtModal()">取消</button>
      <button class="btn-save" onclick="saveArtwork()">儲存作品</button>
    </div>
  </div>
</div>

<!-- ══ 匯出彈窗 ══ -->
<div class="overlay" id="exportOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal" style="max-width:480px">
    <div class="modal-head">
      <div class="modal-title">批量匯出</div>
      <button class="modal-close" onclick="document.getElementById('exportOverlay').classList.remove('open')">×</button>
    </div>
    <p style="font-size:13px;color:var(--ink-3);margin-bottom:14px">已選取 <strong id="expCount">0</strong> 件作品</p>
    <label class="export-opt">
      <input type="radio" name="expFmt" value="csv" checked>
      <div class="opt-info"><strong>完整 CSV（內部用）</strong><span>含委賣人資料、賣方實拿、合約狀態、內部備註</span></div>
    </label>
    <label class="export-opt">
      <input type="radio" name="expFmt" value="json">
      <div class="opt-info"><strong>JSON（系統串接）</strong><span>完整資料結構</span></div>
    </label>
    <label class="export-opt">
      <input type="radio" name="expFmt" value="client_csv">
      <div class="opt-info"><strong>客戶清單 CSV</strong><span>隱藏委賣人資料與賣方實拿，僅顯示藝廊售價</span></div>
    </label>
    <label class="export-opt featured">
      <input type="radio" name="expFmt" value="collector_html">
      <div class="opt-info"><strong>⭐ 藏家展示網頁</strong><span>精美 HTML，含作品圖片、資料與藝廊售價，可傳給藏家或列印為 PDF</span></div>
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('exportOverlay').classList.remove('open')">取消</button>
      <button class="btn-save" onclick="doExport()">↓ 確認匯出</button>
    </div>
  </div>
</div>

<script src="exhibition.js"></script>
<script src="consignment.js"></script>
<script src="main.js"></script>
</body>
</html>
